- aid: teledyne-technologies:flir-spinnaker-sdk
  name: Teledyne FLIR Spinnaker SDK
  description: >-
    The Spinnaker SDK provides programmatic control of Teledyne FLIR and DALSA machine vision cameras
    over USB3, GigE, 5GigE, and 10GigE interfaces. Supports C++, C#, Python, and Java with a cross-platform
    API for camera discovery, configuration, image acquisition, and processing. Includes SpinView GUI
    for camera exploration and real-time viewing. Used for factory automation, quality inspection, and
    scientific imaging applications.
  humanURL: https://www.flir.com/support/browse/camera-cores--components/machine-vision-cameras/sdks
  baseURL: https://www.flir.com
