- aid: teledyne-technologies:flir-mobile-sdk
  name: Teledyne FLIR Mobile SDK
  description: >-
    The FLIR Mobile SDK enables iOS and Android developers to build mobile applications that integrate
    thermal imaging capabilities from Teledyne FLIR professional thermal cameras. Supports data collection
    from connected thermal cameras and metering devices. Available through FLIR's Developer Program with
    approved access. Includes an App Gallery for showcasing third-party thermal imaging applications.
  humanURL: https://www.flir.com/developer/mobile-sdk/
  baseURL: https://www.flir.com/developer
