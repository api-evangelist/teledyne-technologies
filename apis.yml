- aid: teledyne-technologies:lecroy-activedso-api
  name: Teledyne LeCroy ActiveDSO API
  description: >-
    ActiveDSO is Teledyne LeCroy's ActiveX/COM control enabling remote automation of MAUI-based oscilloscopes
    from Windows applications via SCPI commands, VISA drivers, Ethernet (ENET), GPIB, and USBTMC interfaces.
    Supports Python, C++, C#, LabVIEW, and MATLAB automation. Used for automated test sequences, waveform
    capture, protocol analysis, and measurement reporting in test and measurement workflows.
  humanURL: https://www.teledynelecroy.com/support/techlib/programmingexamples.aspx
  baseURL: https://www.teledynelecroy.com
